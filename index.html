<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ghostmut">
  <title>Ghostmut</title>
  <style>
    :root {
      --accent: #6d4aff;
      --text: #1a1a2e;
      --muted: #6b6b80;
      --bg: #fafafc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header, main, footer {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Hero section */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      padding: 96px 24px;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      color: var(--muted);
      max-width: 540px;
      margin: 0 auto 40px;
    }

    .cta-button {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 10px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(109, 74, 255, 0.35);
    }

    /* Feature cards */
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 24px;
      padding-bottom: 96px;
    }

    .feature {
      background: #fff;
      border: 1px solid #ececf2;
      border-radius: 14px;
      padding: 28px;
      text-align: left;
    }

    .feature h3 { margin-bottom: 8px; }
    .feature p { font-size: 0.95rem; color: var(--muted); }

    footer {
      text-align: center;
      padding: 32px 24px;
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid #ececf2;
    }

    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <main class="hero">
    <h1>Ghostmut</h1>
    <p>how about.... Ghostmut?</p>
    <div>
      <a href="#features" class="cta-button">Get Started</a>
    </div>
  </main>

  <section>
    <div class="features" id="features">
      <div class="feature">
        <h3>How?</h3>
        <p>How...</p>
      </div>
      <div class="feature">
        <h3>About?</h3>
        <p>about.....</p>
      </div>
      <div class="feature">
        <h3>Ghostmut?</h3>
        <p>ghostmut?</p>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2026 ghostmut· <a href="https://github.com/ghostmutdev">GitHub</a></p>
  </footer>
</body>
</html>
