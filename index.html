<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Character Learning</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🇯🇵 Japanese Character Learning</h1>
        <nav>
            <button class="nav-btn active" data-mode="hiragana">ひらがな</button>
            <button class="nav-btn" data-mode="katakana">カタカナ</button>
            <button class="nav-btn" data-mode="kanji">漢字</button>
        </nav>
    </header>
    
    <main>
        <div class="quiz-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div class="stats">
                <span>Score: <strong id="scoreDisplay">0</strong>/<strong id="totalDisplay">0</strong></span>
                <span>Streak: <strong id="streakDisplay">0</strong> 🔥</span>
            </div>
            
            <div class="character-card" id="characterCard">
                <div class="character" id="characterDisplay">?</div>
                <div class="hint" id="hintDisplay"></div>
            </div>
            
            <form id="answerForm">
                <input 
                    type="text" 
                    id="answerInput" 
                    placeholder="Type the reading (romaji or Japanese)" 
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                >
                <button type="submit" class="submit-btn">Check</button>
            </form>
            
            <div class="feedback" id="feedback">
                <p id="feedbackText"></p>
            </div>
            
            <button class="skip-btn" id="skipBtn">Skip</button>
            
            <div class="mode-info" id="modeInfo">
                Select a mode above to begin!
            </div>
        </div>
        
        <div class="controls">
            <label>
                <input type="checkbox" id="showRomaji"> Show Romaji Hints
            </label>
            <label>
                <input type="checkbox" id="japaneseInput"> Allow Japanese Input
            </label>
        </div>
    </main>
    
    <footer>
        <p>Built for Japanese learners • Hosted on GitHub Pages</p>
    </footer>
    
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
