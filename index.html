<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    :root {
      --accent: #6d4aff;
      --text: #1a1a2e;
      --muted: #6b6b80;
      --bg: #fafafc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .container {
      max-width: 720px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 48px;
      font-size: 1.05rem;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    a.card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card {
      background: #fff;
      border: 1px solid #ececf2;
      border-radius: 18px;
      padding: 36px 28px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(109, 74, 255, 0.18);
      border-color: #d8d2ff;
    }

    .card .icon {
      font-size: 2.75rem;
      margin-bottom: 16px;
      display: block;
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .card .cta {
      display: inline-block;
      margin-top: 18px;
      background: var(--accent);
      color: #fff;
      padding: 10px 26px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }

    .card:hover .cta {
      background: #5a3ae0;
    }

    footer {
      margin-top: 56px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome 👋</h1>
    <p class="subtitle">Pick where you want to go:</p>

    <div class="links">
      <a class="card-link" href="japanese.html">
        <div class="card">
          <span class="icon">🇯🇵</span>
          <h2>Japanese Learning</h2>
          <p>Learn hiragana, katakana and kanji with quizzes, audio and progress tracking.</p>
          <span class="cta">Start Studying</span>
        </div>
      </a>

      <a class="card-link" href="lr.html">
        <div class="card">
          <span class="icon">🎲</span>
          <h2>LR Gamble-ator</h2>
          <p>Generate random sequences of L's and R's. Use at your own risk.</p>
          <span class="cta">Generate Sequence</span>
        </div>
      </a>
    </div>

    <footer>Hosted on GitHub Pages</footer>
  </div>
</body>
</html>
