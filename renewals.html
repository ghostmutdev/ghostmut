<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Renewals</title>
  <style>
    :root {
      --accent: #6d4aff;
      --text: #1a1a2e;
      --muted: #6b6b80;
      --bg: #fafafc;
      --warn: #c73e3e;
      --soon: #d9822b;
      --ok: #2e9e5b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 48px 24px;
    }

    .container { max-width: 760px; margin: 0 auto; }

    .top-nav { margin-bottom: 24px; }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover { color: var(--accent); }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .car-section {
      background: #fff;
      border: 1px solid #ececf2;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .car-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .car-header .emoji { font-size: 1.75rem; }

    .car-header h2 { font-size: 1.35rem; }

    .renewal-row {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f5;
    }

    .renewal-row:last-child { border-bottom: none; }

    .renewal-row .item-name { font-weight: 600; font-size: 0.95rem; }

    .renewal-row .date-display {
      font-size: 1rem;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .renewal-row .date-display.not-set { color: var(--muted); font-style: italic; }

    .status-badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 12px;
      min-width: 86px;
      text-align: center;
    }

    .status-placeholder { color: var(--muted); background: #f0f0f5; }
    .status-expired { color: #fff; background: var(--warn); }
    .status-soon { color: #fff; background: var(--soon); }
    .status-ok { color: #fff; background: var(--ok); }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 500px) {
      .renewal-row {
        grid-template-columns: 1fr auto;
      }
      .renewal-row .item-name { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a class="back-link" href="index.html">← Home</a>
    </div>

    <h1>Car Renewals 🚗</h1>
    <p class="subtitle">Renewal dates are maintained in this page's source code and updated via git.</p>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- EDIT DATES HERE — format YYYY-MM-DD, or "" if not yet known -->
    <!-- Then commit and git push to publish the change              -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <script>
      const RENEWAL_DATA = {
        mazda: {
          label: 'Mazda',
          emoji: '🚙',
          insurance: '1900-01-01',
          mot: '1900-01-01',
          tax: '1900-01-01',
          breakdown: '1900-01-01'
        },
        toyota: {
          label: 'Toyota',
          emoji: '🚗',
          insurance: '1900-01-01',
          mot: '1900-01-01',
          tax: '1900-01-01',
          breakdown: '1900-01-01'
        }
      };
    </script>

    <div id="cars"></div>

    <footer>Dates managed via version control • <a href="index.html" style="color: var(--muted);">Back to home</a></footer>
  </div>

  <script>
    const ITEM_LABELS = { insurance: 'Insurance', mot: 'MOT', tax: 'Tax', breakdown: 'Breakdown' };

    function daysUntil(dateStr) {
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var target = new Date(dateStr + 'T00:00:00');
      return Math.round((target - today) / 86400000);
    }

    function isPlaceholder(dateStr) {
      return !dateStr || dateStr === '1900-01-01';
    }

    function prettyDate(dateStr) {
      return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-GB');
    }

    function buildRow(carKey, itemKey) {
      var val = RENEWAL_DATA[carKey][itemKey];
      var notSet = isPlaceholder(val);
      var statusHtml;

      if (notSet) {
        statusHtml = '<span class="status-badge status-placeholder">Not set</span>';
      } else {
        var d = daysUntil(val);
        if (d < 0) {
          statusHtml = '<span class="status-badge status-expired">Expired</span>';
        } else if (d <= 30) {
          statusHtml = '<span class="status-badge status-soon">' + d + ' day' + (d === 1 ? '' : 's') + '</span>';
        } else {
          statusHtml = '<span class="status-badge status-ok">' + prettyDate(val) + '</span>';
        }
      }

      return '<div class="renewal-row">' +
        '<span class="item-name">' + ITEM_LABELS[itemKey] + '</span>' +
        '<span class="date-display' + (notSet ? ' not-set' : '') + '">' + (notSet ? 'Not set' : prettyDate(val)) + '</span>' +
        statusHtml +
        '</div>';
    }

    function render() {
      var html = '';
      Object.keys(RENEWAL_DATA).forEach(function(carKey) {
        var car = RENEWAL_DATA[carKey];
        html += '<div class="car-section">' +
          '<div class="car-header"><span class="emoji">' + car.emoji + '</span><h2>' + car.label + '</h2></div>' +
          ['insurance', 'mot', 'tax', 'breakdown'].map(function(itemKey) {
            return buildRow(carKey, itemKey);
          }).join('') +
          '</div>';
      });
      document.getElementById('cars').innerHTML = html;
    }

    render();
  </script>
</body>
</html>
